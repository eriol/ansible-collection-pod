---

- block:
    - name: Install podman and acl
      ansible.builtin.apt:
        name:
          - podman
          - acl # needed by ansible to become an unprivileged user
        update_cache: true
        cache_valid_time: 3600

    - name: Ensure linkding group exits
      ansible.builtin.group:
        name: linkding

    - name: Ensure linkding user exists and has restrictive settings
      ansible.builtin.user:
        name: linkding
        groups: linkding
        password: "*"
        home: "{{ linkding_dir }}"
        shell: /usr/sbin/nologin

    - name: Check if linkding user is lingering
      ansible.builtin.stat:
        path: "/var/lib/systemd/linger/linkding"
      register: linkding_user_lingering

    - name: Enable linger for linkding user
      ansible.builtin.command: "loginctl enable-linger linkding"
      when: not linkding_user_lingering.stat.exists

  become: "{{ linkding_become }}"
  become_user: "{{ linkding_become_user }}"

- block:
    - name: Check if the old linkding container service unit exists
      ansible.builtin.stat:
        path: ~/.config/systemd/user/container-linkding.service
      register: linkding_old_unit

    - name: Migrate from the old generated systemd unit to quadlet
      when: linkding_old_unit.stat.exists
      block:
        - name: Old linkding container service must be stopped and disabled
          ansible.builtin.systemd:
            name: container-linkding
            state: stopped
            enabled: false
            scope: user
          failed_when: false

        - name: Old linkding container service unit must be absent
          ansible.builtin.file:
            path: ~/.config/systemd/user/container-linkding.service
            state: absent

        - name: Old linkding container must be absent
          containers.podman.podman_container:
            name: linkding
            state: absent

    - name: Ensure linkding quadlet exists
      containers.podman.podman_container:
        name: linkding
        image: "docker.io/sissbruecker/linkding:{{ linkding_tag }}"
        ports:
          - "{{ linkding_host_ip }}:{{ linkding_host_port }}:9090"
        volume:
          - "linkding-data:/etc/linkding/data"
        state: quadlet
        quadlet_filename: linkding
        quadlet_file_mode: "0640"
        quadlet_options:
          - |
            [Install]
            WantedBy=default.target
      register: linkding_quadlet

    - name: Linkding container must be started and enabled on systemd
      ansible.builtin.systemd:
        name: linkding
        daemon_reload: true
        state: "{{ 'restarted' if linkding_quadlet.changed else 'started' }}"
        enabled: true
        scope: user

  become: true
  become_user: linkding
