---

- name: Setup user and lingering
  become: "{{ homeassistant_become }}"
  become_user: "{{ homeassistant_become_user }}"
  block:
    - name: Install podman and dependencies
      ansible.builtin.apt:
        name:
          - podman
          - acl # needed by ansible to become an unprivileged user
          - dbus-user-session # needed by rootless podman to talk to systemd
        update_cache: true
        cache_valid_time: 3600

    - name: Ensure homeassistant group exits
      ansible.builtin.group:
        name: homeassistant

    - name: Ensure homeassistant user exists and has restrictive settings
      ansible.builtin.user:
        name: homeassistant
        group: homeassistant
        password: "*"
        home: "{{ homeassistant_dir }}"
        shell: /usr/sbin/nologin

    - name: Check if homeassistant user is lingering
      ansible.builtin.stat:
        path: "/var/lib/systemd/linger/homeassistant"
      register: homeassistant_user_lingering

    - name: Enable linger for homeassistant user
      ansible.builtin.command: "loginctl enable-linger homeassistant"
      when: not homeassistant_user_lingering.stat.exists
      changed_when: true

- name: OCI stuff
  become: true
  become_user: homeassistant
  block:
    - name: Ensure the D-Bus session bus is running for homeassistant
      ansible.builtin.systemd:
        name: dbus.socket
        state: started
        daemon_reload: true
        scope: user

    - name: Check if the old homeassistant container service unit exists
      ansible.builtin.stat:
        path: ~/.config/systemd/user/container-homeassistant.service
      register: homeassistant_old_unit

    - name: Migrate from the old generated systemd unit to quadlet
      when: homeassistant_old_unit.stat.exists
      block:
        - name: Old homeassistant container service must be stopped and disabled
          ansible.builtin.systemd:
            name: container-homeassistant
            state: stopped
            enabled: false
            scope: user
          failed_when: false

        - name: Old homeassistant container service unit must be absent
          ansible.builtin.file:
            path: ~/.config/systemd/user/container-homeassistant.service
            state: absent

        - name: Old homeassistant container must be absent
          containers.podman.podman_container:
            name: homeassistant
            state: absent

    - name: Ensure homeassistant quadlet exists
      containers.podman.podman_container:
        name: homeassistant
        image: "ghcr.io/home-assistant/home-assistant:{{ homeassistant_tag }}"
        network: host
        privileged: true
        ports:
          - "{{ homeassistant_host_ip }}:{{ homeassistant_host_port }}:8123"
        env:
          TZ: "{{ homeassistant_time_zone }}"
        volume:
          - "homeassistant_data:/config"
        state: quadlet
        quadlet_filename: homeassistant
        quadlet_file_mode: "0640"
        quadlet_options:
          - |
              [Install]
              WantedBy=default.target
      register: homeassistant_quadlet

    - name: Homeassistant container must be started and enabled on systemd
      ansible.builtin.systemd:
        name: homeassistant
        daemon_reload: true
        state: "{{ 'restarted' if homeassistant_quadlet.changed else 'started' }}"
        enabled: true
        scope: user
