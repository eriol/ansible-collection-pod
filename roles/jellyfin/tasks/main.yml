---

- block:

    - name: Install podman and dependencies
      ansible.builtin.apt:
        name:
          - podman
          - acl  # needed by ansible to become an unprivileged user
          - dbus-user-session  # needed by rootless podman to talk to systemd
        update_cache: true
        cache_valid_time: 3600

    - name: Ensure jellyfin group exits
      ansible.builtin.group:
        name: jellyfin

    - name: Ensure jellyfin user exists and has restrictive settings
      ansible.builtin.user:
        name: jellyfin
        group: jellyfin
        password: "*"
        home: "{{ jellyfin_dir }}"
        shell: /usr/sbin/nologin

    - name: Check if jellyfin user is lingering
      ansible.builtin.stat:
        path: "/var/lib/systemd/linger/jellyfin"
      register: jellyfin_user_lingering

    - name: Enable linger for jellyfin user
      ansible.builtin.command: "loginctl enable-linger jellyfin"
      when: not jellyfin_user_lingering.stat.exists

  become: "{{ jellyfin_become }}"
  become_user: "{{ jellyfin_become_user }}"

- block:

    - name: Ensure the D-Bus session bus is running for jellyfin
      ansible.builtin.systemd:
        name: dbus.socket
        state: started
        daemon_reload: true
        scope: user

    - name: Check if the old jellyfin container service unit exists
      ansible.builtin.stat:
        path: ~/.config/systemd/user/container-jellyfin.service
      register: jellyfin_old_unit

    - name: Migrate from the old generated systemd unit to quadlet
      when: jellyfin_old_unit.stat.exists
      block:
        - name: Old jellyfin container service must be stopped and disabled
          ansible.builtin.systemd:
            name: container-jellyfin
            state: stopped
            enabled: false
            scope: user
          failed_when: false

        - name: Old jellyfin container service unit must be absent
          ansible.builtin.file:
            path: ~/.config/systemd/user/container-jellyfin.service
            state: absent

        - name: Old jellyfin container must be absent
          containers.podman.podman_container:
            name: jellyfin
            state: absent

    - name: Ensure jellyfin quadlet exists
      containers.podman.podman_container:
        name: jellyfin
        image: "docker.io/jellyfin/jellyfin:{{ jellyfin_tag }}"
        ports:
          - "{{ jellyfin_host_ip }}:{{ jellyfin_host_port }}:8096"
        volume:
          - "jellyfin-data:/data"
          - "jellyfin-config:/config"
        mount:
          - "type=bind,source={{ jellyfin_media_path }},destination=/media,ro=true,relabel=private"
        state: quadlet
        quadlet_filename: jellyfin
        quadlet_file_mode: "0640"
        quadlet_options:
          - |
              [Install]
              WantedBy=default.target
      register: jellyfin_quadlet

    - name: Jellyfin container must be started and enabled on systemd
      ansible.builtin.systemd:
        name: jellyfin
        daemon_reload: true
        state: "{{ 'restarted' if jellyfin_quadlet.changed else 'started' }}"
        enabled: true
        scope: user

  become: true
  become_user: jellyfin
